<div class="contact-container">

  <div class="header">
    <h2 class="section-title">Hablemos</h2>
    <p class="section-subtitle">
      ¿Tienes un proyecto en mente o una oferta laboral? Envíame un mensaje.
    </p>
  </div>

  <div class="content-wrapper">

    <div class="contact-info">

      <div class="info-card">
        <h3>Información de Contacto</h3>
        <p>Estoy disponible para nuevos proyectos y oportunidades laborales.</p>

        <div class="info-item">
          <i class="icon-mail">📧</i> <a href="mailto:fabrizio@gmail.com">fabriziogarrogarcia@gmail.com</a>
        </div>

        <div class="info-item">
          <i class="icon-location">📍</i>
          <span>Barranca, Lima, Perú</span>
        </div>
      </div>

      <div class="social-links">
        <h3>Sígueme</h3>
        <div class="links">
          <a href="https://github.com/fabrz18" target="_blank" class="social-btn github">
            GitHub
          </a>
          <a href="https://www.linkedin.com/in/fabrizio-arturo-g-22b496325/" target="_blank" class="social-btn linkedin">
            LinkedIn
          </a>
        </div>
      </div>

    </div>

    <div class="form-wrapper">
      <form name="contact" method="POST" data-netlify="true">

        <input type="hidden" name="form-name" value="contact" />

        <div class="form-group">
          <label for="name">Nombre</label>
          <input type="text" id="name" name="name" placeholder="Tu nombre" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
        </div>

        <div class="form-group">
          <label for="message">Mensaje</label>
          <textarea id="message" name="message" rows="5" placeholder="Cuéntame sobre tu proyecto..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">
          Enviar Mensaje
        </button>
      </form>
    </div>

  </div>
</div>
